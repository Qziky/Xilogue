[project]
name = "xilogue"
version = "0.1.0"
description = "Xilogue — local-first searchable memory for Windows."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "pystray>=0.19.5",
    "rapidocr-onnxruntime==1.4.4",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
    "windows-capture==2.0.1",
]

[project.scripts]
xilogue = "xilogue:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "psutil>=7.2.2",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
